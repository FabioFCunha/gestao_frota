name: transfrota-pwa-piloto
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transfrota_pwa
      POSTGRES_USER: transfrota_pwa
      POSTGRES_PASSWORD: ${PWA_DB_PASSWORD:?Configure PWA_DB_PASSWORD no arquivo .env da homologacao}
    volumes:
      - pilot_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfrota_pwa -d transfrota_pwa"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build:
      context: ../..
    environment:
      DJANGO_SETTINGS_MODULE: config.driver_settings
      DJANGO_SECRET_KEY: ${PWA_SECRET_KEY:?Configure PWA_SECRET_KEY no arquivo .env da homologacao}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${PWA_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${PWA_CSRF_ORIGINS:-http://localhost:8003,http://127.0.0.1:8003}
      POSTGRES_DB: transfrota_pwa
      POSTGRES_USER: transfrota_pwa
      POSTGRES_PASSWORD: ${PWA_DB_PASSWORD:?Configure PWA_DB_PASSWORD}
      POSTGRES_HOST: database
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 90"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/driver/app/manifest.webmanifest', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    volumes:
      - pilot_static:/app/staticfiles
      - pilot_media:/app/media
  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8003:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - pilot_static:/staticfiles:ro
      - pilot_media:/media:ro
    depends_on:
      web:
        condition: service_healthy
volumes:
  pilot_database:
  pilot_static:
  pilot_media:
