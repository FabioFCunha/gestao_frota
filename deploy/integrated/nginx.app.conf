map $http_x_forwarded_proto $app_forwarded_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /static/ {
        alias /staticfiles/;
    }
    # Host identifies the operational surface in the SAME main backend.
    # No public media alias: photos/documents require authenticated endpoints.
    location / {
        proxy_pass http://frota_backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $app_forwarded_proto;
        proxy_read_timeout 90s;
    }
}
