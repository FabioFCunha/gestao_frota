<style>
.cnh-car-loader {margin:24px auto;width:min(340px,100%);text-align:center;color:#2563eb;}
.cnh-car-road {position:relative;height:70px;overflow:hidden;border-bottom:2px solid #cbd5e1;border-radius:8px;background:linear-gradient(0deg,#eff6ff,transparent);}
.cnh-car-road:after {content:'';position:absolute;bottom:6px;left:0;width:200%;height:2px;background:repeating-linear-gradient(90deg,#94a3b8 0 18px,transparent 18px 40px);animation:cnh-road-run .7s linear infinite;}
.cnh-car {position:absolute;bottom:12px;left:calc(50% - 38px);width:76px;height:38px;animation:cnh-car-bounce .4s ease-in-out infinite alternate;}
.cnh-car-wind {position:absolute;left:calc(50% - 86px);bottom:29px;width:35px;height:2px;background:#93c5fd;box-shadow:-12px 7px #bfdbfe,5px -7px #bfdbfe;animation:cnh-car-wind .6s linear infinite;}
.cnh-car-loader p {font-size:13px;color:#64748b;margin:10px 0 0;}
#cnh-job[data-state="failed"] .cnh-car-loader {display:none;}
@keyframes cnh-road-run {to {transform:translateX(-40px);}}
@keyframes cnh-car-bounce {to {transform:translateY(-2px);}}
@keyframes cnh-car-wind {to {transform:translateX(-12px);opacity:.25;}}
@media(prefers-reduced-motion:reduce) {.cnh-car-road:after,.cnh-car,.cnh-car-wind {animation:none;}}
</style>
<div class="cnh-car-loader" role="status" aria-label="Processamento em andamento">
