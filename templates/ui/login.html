{% load static %}
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Gestão de Frotas</title><link rel="stylesheet" href="{% static 'ui/app.css' %}"></head><body class="login-page"><section class="login-card"><div class="login-logo"><img src="{% static 'images/logo.png' %}" alt="Gestão de Frotas" style="width: 48px; height: 48px; object-fit: contain;"></div><p class="eyebrow">AMBIENTE INTERNO</p><h1>Gestão de Frotas</h1><p class="muted">Acesse para consultar e operar a frota institucional.</p>{% if form.errors %}<p class="error">Usuário ou senha inválidos.</p>{% endif %}<form method="post">{% csrf_token %}<label>E-mail (login)<input name="username" type="email" autocomplete="username" autofocus required placeholder="seu@email.com"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar no sistema</button></form></section></body></html>
