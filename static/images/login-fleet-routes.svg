<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="1" stop-color="#050b1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.65" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0" y1="1" x2="0.8" y2="0.3">
      <stop offset="0" stop-color="#050b1c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#050b1c" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1b2f5e" stroke-width="0.6" opacity="0.5"/>
    </pattern>

    <!-- Rotas -->
    <path id="rA" d="M-50 650 C 250 600, 400 350, 700 380 S 1100 200, 1250 150"/>
    <path id="rB" d="M200 -50 C 300 200, 500 250, 650 450 S 800 800, 950 950"/>
    <path id="rC" d="M-50 300 C 200 350, 500 100, 800 120 S 1100 400, 1250 520"/>
    <path id="rD" d="M600 -50 C 650 200, 900 300, 1000 500 S 1150 750, 1250 800"/>

    <!-- Marcador de veículo -->
    <g id="car">
      <circle r="20" fill="#0b1a3a" stroke="currentColor" stroke-width="2.5"/>
      <g fill="currentColor" transform="translate(-11 -8)">
        <path d="M3 9 L5 4 Q5.5 3 6.8 3 H15.2 Q16.5 3 17 4 L19 9 Q21 9.5 21 11.5 V14 H19.5 V15.5 H16.5 V14 H5.5 V15.5 H2.5 V14 H1 V11.5 Q1 9.5 3 9 Z M6.8 5 L5.6 8.5 H16.4 L15.2 5 Z" transform="scale(0.95)"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Velocímetro / gauge decorativo -->
  <g transform="translate(820 400)" fill="none" stroke="#2f5bb8" opacity="0.28">
    <circle r="300" stroke-width="1.5"/>
    <circle r="250" stroke-width="1" stroke-dasharray="2 10"/>
    <circle r="200" stroke-width="1"/>
    <path d="M-212 150 A260 260 0 1 1 212 150" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Ruas -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#1a3a7a" stroke-width="26" opacity="0.55">
      <use href="#rA"/><use href="#rB"/><use href="#rC"/><use href="#rD"/>
    </g>
    <g stroke="#0d1d42" stroke-width="22">
      <use href="#rA"/><use href="#rB"/><use href="#rC"/><use href="#rD"/>
    </g>
    <g stroke="#3a62b5" stroke-width="1.5" stroke-dasharray="10 12" opacity="0.8">
      <use href="#rA"/><use href="#rB"/><use href="#rC"/><use href="#rD"/>
    </g>

    <!-- Rota ativa (azul) -->
    <use href="#rA" stroke="#38bdf8" stroke-width="8" opacity="0.5" filter="url(#blur)"/>
    <use href="#rA" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/>
    </use>

    <!-- Rota ativa (laranja) -->
    <use href="#rD" stroke="#f97316" stroke-width="8" opacity="0.4" filter="url(#blur)"/>
    <use href="#rD" stroke="#f97316" stroke-width="3" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.6s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Pontos de parada -->
  <g>
    <g fill="#38bdf8">
      <circle cx="700" cy="380" r="7"/>
      <circle cx="700" cy="380" r="7" fill="none" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" from="7" to="30" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#f97316">
      <circle cx="1000" cy="500" r="7"/>
      <circle cx="1000" cy="500" r="7" fill="none" stroke="#f97316" stroke-width="2">
        <animate attributeName="r" from="7" to="30" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="650" cy="450" r="5" fill="#34d399"/>
    <circle cx="800" cy="120" r="5" fill="#34d399"/>
    <circle cx="320" cy="470" r="5" fill="#34d399"/>
  </g>

  <!-- Veículos em movimento -->
  <g color="#38bdf8">
    <use href="#car">
      <animateMotion dur="14s" repeatCount="indefinite" rotate="0"><mpath href="#rA"/></animateMotion>
    </use>
  </g>
  <g color="#f97316">
    <use href="#car">
      <animateMotion dur="16s" repeatCount="indefinite" begin="-6s"><mpath href="#rD"/></animateMotion>
    </use>
  </g>
  <g color="#34d399">
    <use href="#car">
      <animateMotion dur="18s" repeatCount="indefinite" begin="-9s"><mpath href="#rC"/></animateMotion>
    </use>
  </g>
  <g color="#38bdf8">
    <use href="#car">
      <animateMotion dur="20s" repeatCount="indefinite" begin="-3s"><mpath href="#rB"/></animateMotion>
    </use>
  </g>

  <!-- Escurece o canto inferior esquerdo para dar leitura ao texto -->
  <rect width="1200" height="900" fill="url(#fadeLeft)"/>
</svg>