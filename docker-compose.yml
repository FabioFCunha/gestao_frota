services:
  db:
    image: postgres:16-alpine
    container_name: frota_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - frota_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: frota_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8000),timeout=2).close()"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - frota_media:/app/media
      - frota_static:/app/staticfiles

  cnh_worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: python manage.py cnh_import_worker
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frota_media:/app/media
    mem_limit: 768m
    cpus: 1.0


volumes:
  frota_postgres_data:
  frota_media:
  frota_static:
